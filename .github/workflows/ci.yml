name: API Tests CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Скачать код из репозитория
      uses: actions/checkout@v4

    - name: Установить Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Запустить тесты
      run: mvn clean test

    - name: Собрать Allure-отчет через Maven
      if: always()
      run: mvn allure:report

    - name: Загрузить отчет как артефакт Pages
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/site/allure-maven-plugin

    - name: Задеплоить на GitHub Pages
      if: always()
      id: deployment
      uses: actions/deploy-pages@v4
